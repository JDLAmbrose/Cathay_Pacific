name: Build and deploy preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Package a locally runnable build
        run: |
          mkdir -p preview/tools
          cp -R dist preview/dist
          cp tools/serve.py tools/assistant.py preview/tools/
          printf '#!/bin/sh\ncd "$(dirname "$0")" || exit 1\npython3 tools/serve.py --port 8000\n' > preview/preview.command
          chmod +x preview/preview.command
          printf '@echo off\r\ncd /d "%%~dp0"\r\npython tools/serve.py --port 8000\r\npause\r\n' > preview/preview.bat
          printf 'Run preview.command (macOS) or preview.bat (Windows), then open http://127.0.0.1:8000/ . Python 3.9+ is required.\n' > preview/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: plume-light-preview
          path: preview/
          retention-days: 14
      - name: Build for GitHub project Pages
        run: |
          npm test
          npm run build
        env:
          PLUME_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify GitHub Pages deep links and assets
        run: python -m unittest tools.tests.test_frontend.FrontendHTTPTests.test_project_pages_paths
        env:
          PLUME_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
