function demand(d){if(!d||d.countUnknown)return {count:null,weight:30,imputed:30,volume:null,review:0};let known=0,imputed=0,volume=0,missing=false;const items=checked(d);for(const i of items){if(i.weight==null)imputed+=20;else known+=Number(i.weight);if([i.l,i.w,i.h].some(v=>v==null))missing=true;else volume+=i.l*i.w*i.h/1e6;}return {count:items.length,weight:known+imputed,imputed,volume:missing?null:volume,review:items.filter(i=>i.review).length};}
function validateDeclaration(d){if(d.zero||d.countUnknown)return null;if(!d.items.length)return '请添加行李，或明确选择此次没有托运行李。';for(const i of d.items){if(!i.name.trim())return '请填写物品名称。';for(const k of ['weight','l','w','h'])if(i[k]!=null&&(!Number.isFinite(Number(i[k]))||Number(i[k])<=0))return '重量和尺寸须为正数；未知时请留空。';}return null;}
function aggregateBaggage(){const records=Object.values(state.declarations).filter(d=>d.legId===state.flight.legId&&d.status==='submitted'&&!d.countUnknown),reported=79+records.length,unreported=100-reported;let known=1140,imputed=unreported*30,pieces=114,volume=7+unreported*.15,missing=false,reviews=0;for(const d of records){const q=demand(d);known+=q.weight-q.imputed;imputed+=q.imputed;pieces+=q.count;reviews+=q.review;if(q.volume==null)missing=true;else volume+=q.volume;}return {reported,unreported,coverage:reported,known,imputed,weight:known+imputed,pieces,volume:missing?null:volume,reviews};}
function forecastCapacity(){const a=aggregateBaggage(),o=state.ops;return {...a,weightRemaining:[o.budget,o.otherWeight,o.buffer].some(v=>v==null)?null:o.budget-a.weight-o.otherWeight-o.buffer,spaceRemaining:[o.spaceBudget,o.otherSpace,o.spaceBuffer,a.volume].some(v=>v==null)?null:o.spaceBudget-a.volume-o.otherSpace-o.spaceBuffer,expired:o.expired};}
function checkApplicationDeadline(region=state.region,departure=state.flight.departure,now=state.clock){const r=REGIONS[region],dep=new Date(departure).getTime(),n=new Date(now).getTime();if(!r||!Number.isFinite(dep)||!Number.isFinite(n))return {valid:false,deadline:null,hours:null};return {valid:n<=dep-r.hours*3600000,deadline:iso(dep-r.hours*3600000),hours:r.hours};}
function quoteService(){const d=draft(),items=d.items.filter(i=>!d.zero&&!d.countUnknown&&i.mode==='checked'&&i.service);if(!REGIONS[state.region])return {valid:false,error:'请选择支持的寄送地区。'};if(!items.length)return {valid:false,error:'请选择需要首末程服务的托运行李。'};if(items.some(i=>[i.weight,i.l,i.w,i.h].some(v=>v==null||!Number.isFinite(Number(v))||Number(v)<=0)))return {valid:false,error:'服务报价需要完整重量和尺寸；预报仍可保存未知值。'};const weight=items.reduce((s,i)=>s+i.weight,0),large=items.filter(i=>Math.max(i.l,i.w,i.h)>100).length,first=Math.round(15000*items.length*REGIONS[state.region].factor),localGBP=Math.round((items.length*12.5+weight*.5+20+large*15)*100),total=first+localGBP*10;return {valid:true,first,localGBP,total,miles:Math.ceil(total/100*25),earn:Math.floor(total/1000),count:items.length,weight,signature:JSON.stringify({flight:state.flight,region:state.region,items,partner:state.partner,pickup:state.pickup,pickupAddress:state.pickupAddress,destination:state.destinationAddress,contact:state.contact,recipient:state.recipient,phone:state.phone})};}
function isDirty(){const s=state.declarations[state.travellerId];return !s||s.legId!==state.flight.legId||JSON.stringify({items:s.items,zero:s.zero,countUnknown:s.countUnknown})!==JSON.stringify(draft());}
function invalidateAgent(){if(state.agent.answer){state.agent.stale=true;state.agent.answer.stale=true;}}
function saveDeclaration(silent=false){const error=validateDeclaration(draft());if(error){toast(error);return false;}if(!isDirty()){if(!silent)toast('预报已保存，不重复增加需求。');return true;}const old=state.declarations[state.travellerId];state.declarations[state.travellerId]={...clone(draft()),version:(old?.version||0)+1,legId:state.flight.legId,status:'submitted',updatedAt:iso(state.clock)};state.lastSavedAt=iso(state.clock);persist();if(!silent)toast('预报已保存，运营规划同步更新。');return true;}
function validateService(){const q=quoteService();if(!q.valid)return q.error;const err=validateDeclaration(draft());if(err)return err;if(!checkApplicationDeadline().valid)return '已超过该地区的申请截止，无法新预约。';if([state.pickupAddress,state.destinationAddress,state.contact,state.recipient,state.phone].some(v=>!v.trim()))return '请完整填写取送地址与联系人。';const pickup=new Date(state.pickup+':00+08:00').getTime(),latest=new Date(state.flight.departure).getTime()-REGIONS[state.region].pickupLead*3600000;if(!Number.isFinite(pickup)||pickup<new Date(state.clock).getTime()||pickup>latest)return '取件时间须在当前演示时间之后，并满足装机前运输截点。';return null;}

function serviceHTML(){const d=checkApplicationDeadline(),r=REGIONS[state.region];return `<div class="subhead"><div><h2>从家出发，直达你的宿舍</h2><p>按收取地区提前申请，留出充足的交接时间。</p></div></div><div class="fields"><label class="field"><span>寄送 / 上门收取地区</span><select class="input" data-field="region">${Object.entries(REGIONS).map(([v,r])=>option(v,r.name,state.region)).join('')}${option('unsupported','其他地区 · 暂未覆盖',state.region)}</select></label>${field('取件日期与时间 · 香港时间','pickup',state.pickup,'datetime-local')}${field('上门收取地址','pickupAddress',state.pickupAddress,'text','',true)}${field('行李最终目的地','destinationAddress',state.destinationAddress,'text','',true)}<label class="field full"><span>伦敦当地物流 · 拟合作示例</span><select class="input" data-field="partner">${['DPD UK','DHL eCommerce UK','Parcelforce Worldwide'].map(x=>option(x,x,state.partner)).join('')}</select></label></div><div class="notice ${d.valid?'':'error'}"><strong>${d.valid?'✓ 仍可申请':'暂不能申请'}</strong><br>${r?`${r.name}需提前 ${r.hours/24} 天，最迟 ${hk(d.deadline)} HKT。当前演示时间 ${hk(state.clock)} HKT。`:'该地区暂未覆盖。'}</div><div class="grid3">${[['香港境内','1 天'],['大湾区其他覆盖地区','2 天'],['大陆其他地区','5 天']].map(([l,t])=>`<div class="note">${l}<br><strong>起飞前 ${t}</strong></div>`).join('')}</div><div class="note">按连续 24 / 48 / 120 小时计算。最迟申请不等于最迟取件；取件需满足装机前运输截点。LSE 宿舍名称为演示收件标签，实际服务需补全地址和邮编。</div>`;}
function checkoutHTML(){const q=quoteService(),error=validateService(),o=activeOrder();return `<div class="subhead"><div><h2>准备妥当，轻装出发</h2><p>确认资料与费用，选择适合你的结算方式。</p></div><span class="pill gold">模拟交易</span></div>${o?`<div class="notice">已有订单 ${esc(o.id)}，不会重复创建。</div><button class="btn" data-go="journey">查看已有订单 →</button>`:''}${[['乘机人',person().name],['取件',state.pickupAddress],['送达',state.destinationAddress],['联系人 / 接收人',state.contact+' / '+state.recipient],['伦敦交接方',state.partner+' · 拟合作']].map(([l,v])=>`<div class="row"><span class="muted">${l}</span><strong>${esc(v)}</strong></div>`).join('')}<div class="divider"></div>${q.valid?`<div class="row"><span>首程及服务处理</span><strong>${money(q.first)}</strong></div><div class="row"><span>伦敦当地配送</span><strong>GBP ${fmt(q.localGBP/100,2)} / ${money(q.localGBP*10)}</strong></div><div class="row total"><span>服务演示总价</span><strong>${money(q.total)}</strong></div><div class="payoptions"><label class="payoption"><input type="radio" name="payment" data-field="payment" value="cash" ${state.payment==='cash'?'checked':''}>现金购买<strong>${money(q.total)}</strong><small>预计赚取 ${fmt(q.earn)} 亚洲万里通里数</small></label><label class="payoption"><input type="radio" name="payment" data-field="payment" value="miles" ${state.payment==='miles'?'checked':''}>里数兑换<strong>${fmt(q.miles)} 里数</strong><small>可用 ${fmt(state.milesBalance)} · 本单赚 0 里数</small></label></div>`:`<div class="notice error">${esc(q.error)}</div>`}<div class="note">演示汇率 GBP 1 = HKD 10；每 HKD 1 兑 25 里数，每 HKD 10 合资格现金赚 1 里数。并非现行会员政策。额外托运费、关税和特殊处理未计，不是全包价。</div>${draft().items.some(i=>i.review)?'<div class="notice">清单有规则待复核物品，服务预约不等于承运批准，请向航司确认。</div>':''}${error?`<div class="notice error" role="alert">${esc(error)}</div>`:''}<label class="check" style="margin-top:17px"><input type="checkbox" data-field="agreed" ${state.agreed?'checked':''}><span>我已核对资料，并理解此次为模拟预约与交易，待复核物品仍需官方确认。</span></label><button class="btn" data-action="pay" ${!q.valid||!!error||!state.agreed||state.processing||!!o?'disabled':''}>${state.processing?'正在处理…':state.payment==='cash'?'模拟现金支付 · '+(q.valid?money(q.total):''):'模拟里数兑换 · '+(q.valid?fmt(q.miles):'')} →</button>`;}
function bookHTML(){return `${head('把行李安排好，出发更从容','先保存预报，再按需要预约首末程服务。')}<div class="workspace"><div class="card"><nav class="steps" aria-label="预约步骤">${STEPS.map((n,i)=>`<button class="step ${i+1<state.step?'done':''}" data-action="step" data-step="${i+1}" ${i+1===state.step?'aria-current="step"':''}><i>${i+1<state.step?'✓':i+1}</i><span>${n}</span></button>`).join('')}</nav>${[passengerHTML,baggageHTML,()=>agentHTML(true),serviceHTML,checkoutHTML][state.step-1]()}<div class="formfooter"><button class="btn light" data-action="prev">${state.step===1?'返回首页':'← 上一步'}</button>${state.step<5?`<button class="btn" data-action="next">${state.step===2?'保存并继续':state.step===3?'继续安排服务':'下一步'} →</button>`:'<button class="textbtn" data-go="journey">查看行程概览</button>'}</div></div><aside id="liveSummary">${summaryHTML()}</aside></div>`;}
function eventCounts(o){const ids=o?.itemIds||[],events=state.events.filter(e=>e.orderId===o?.id),counts={};for(const type of ['airport','loaded','handover'])counts[type]=new Set(events.filter(e=>e.type===type).flatMap(e=>e.itemIds).filter(id=>ids.includes(id))).size;return counts;}
function journeyHTML(){const o=activeOrder(),last=state.orders.filter(o=>o.travellerId===state.travellerId).at(-1),d=demand(o?.declaration||draft()),c=eventCounts(o),n=o?.itemIds.length||checked(draft()).filter(i=>i.service).length;return `${head('你的行程，心中有数','只确认重要交接，把精力留给旅途。')}<div class="grid2"><div class="card"><span class="eyebrow" style="color:var(--green)">CATHAY PACIFIC · CX257</span><h2 style="margin-top:17px">香港 HKG → 伦敦 LHR T3</h2><p class="small muted" style="margin-top:10px">${hk(o?.flight.departure||state.flight.departure)} HKT 起飞 · 演示时刻</p><div class="divider"></div><small class="muted">行李最终目的地</small><h3>${esc(o?.destination||state.destinationAddress)}</h3><div class="actions" style="margin-top:17px"><span class="pill">${esc(person().name)}</span><span class="pill gold">${d.count==null?'件数未知':d.count+' 件托运行李'}</span></div></div><div class="card"><div class="subhead"><h3>首末程服务</h3><span class="pill ${o?'':'gold'}">${o?(o.status==='completed'?'服务已完成':'已预约'):last?.status==='cancelled'?'订单已取消':'尚未预约'}</span></div>${o?`${[['订单',o.id],['取件 · HKT',o.pickup.replace('T',' ')],['伦敦交接',o.partner+' · 拟合作'],['模拟结算',o.payment==='cash'?money(o.quote.total):fmt(o.quote.miles)+' 里数'],[o.earned?'已入账':'预计可赚',fmt(o.payment==='cash'?o.quote.earn:0)+' 里数']].map(([l,v])=>`<div class="row"><span class="muted">${l}</span><strong>${esc(v)}</strong></div>`).join('')}<div class="actions" style="margin-top:12px"><button class="textbtn" data-action="contact">联系服务方</button><button class="textbtn" data-action="cancel-order" data-id="${o.id}">取消并模拟退款</button></div>`:`<p class="small muted">${last?'已按原支付方式模拟退款，行李预报仍保留。':'预报可独立保存，确定好行程后再预约搬运服务。'}</p><button class="btn" style="margin-top:22px" data-action="start">安排我的行李 →</button>`}</div></div><div class="sectiontitle"><div><h2>行李关键确认</h2><p>等待交接方的确认，支付或航班起飞不会自动推进。</p></div><span class="pill gold">三类节点 · 演示事件</span></div><div class="nodegrid">${[['airport','到达机场','HKG · 本地物流交至机场'],['loaded','装入飞机','HKG · CX257 装机确认'],['handover','航司与当地物流交接','LHR T3 · 国泰 → '+(o?.partner||state.partner)]].map(([type,title,desc],i)=>{const done=o&&c[type]===n&&n>0,lastEvent=state.events.filter(e=>e.orderId===o?.id&&e.type===type).at(-1);return `<article class="node ${done?'done':''}"><span class="nodeicon" aria-hidden="true">${done?'✓':'0'+(i+1)}</span><h3>${title}</h3><strong>${c[type]} / ${n} 件已确认</strong><p>${esc(desc)}</p><p>${done?'确认于 '+hk(lastEvent.confirmedAt)+' HKT':'等待交接方确认'}</p></article>`}).join('')}</div>${o?`<details class="controlbar"><summary>演示节点控制 · 由模拟交接事件推进</summary><div class="actions" style="margin-top:16px">${[['airport','确认到机场'],['partial','仅 3 件装机'],['loaded','确认全部装机'],['handover','确认伦敦物流交接']].map(([kind,label])=>`<button class="btn slim light" data-action="event" data-kind="${kind}">${label}</button>`).join('')}<button class="btn slim" data-action="complete-service">模拟服务完成并入账</button></div><p class="small muted" style="margin-top:12px">内部完成事件仅更新订单与里数账本，不新增用户追踪节点。</p></details>`:''}<div class="note">预约按下单快照保存。预报的后续修改不会静默改变已接受订单，需要变更服务请联系服务方或取消后重新申请。</div>`;}
function opsHTML(){const f=forecastCapacity(),o=state.ops,missing=f.weightRemaining==null||f.spaceRemaining==null,negative=f.weightRemaining<0||f.spaceRemaining<0;return `${head('让行李预报，成为更早的规划依据','CX257 · 100 名演示旅客 · 与用户端共享已保存预报','运营演示 · 规划参考')}<div class="metrics">${[
['申报覆盖率',f.coverage+'<small>%</small>',f.reported+' 人已报 / '+f.unreported+' 人待报'],['预计托运行李总重',fmt(f.weight)+' <small>kg</small>','已知 '+fmt(f.known)+' + 补估 '+fmt(f.imputed)],['重量规划余量',f.weightRemaining==null||f.expired?'待确认':fmt(f.weightRemaining)+' <small>kg</small>',negative?'存在缺口，需人工复核':'行李与其他货物分开扣减'],['空间规划余量',f.spaceRemaining==null||f.expired?'待补充':fmt(f.spaceRemaining,2)+' <small>m³</small>','外形体积估计，非装载许可']].map(([label,v,note])=>`<div class="metric"><label>${label}</label><div class="value">${v}</div><small>${note}</small></div>`).join('')}</div>${missing||negative||f.expired||f.reviews?`<div class="notice ${negative?'error':''}">${f.expired?'数据已过期，暂不能确认容量。':negative?'预测超出预算，显示缺口并转运营复核。':missing?'尺寸或运营预算缺失，完整规划余量待确认。':f.reviews+' 件行李规则待复核。'} 不自动销售或释放货运舱位。</div>`:''}<div class="grid2" style="margin-top:22px"><div class="card"><h3>提前了解需求，更新规划参考</h3><p class="small muted" style="margin-top:7px">信息改善预测，不会增加飞机的物理容量。</p><div class="meter" aria-label="行李、其他货物与缓冲占用"><span style="width:${Math.max(0,Math.min(100,f.weight/50))}%;background:#00645b"></span><span style="width:24%;background:#9eada1"></span><span style="width:6%;background:#d4bf91"></span></div><div class="legend"><span>深绿 · 行李预报</span><span>灰绿 · 其他货物</span><span>金色 · 缓冲</span></div><div class="divider"></div>${[['未得到预报时的行李基线','2400 kg'],['基线重量余量',o.budget==null?'待确认':fmt(o.budget-2400-o.otherWeight-o.buffer)+' kg'],['当前行李预测',fmt(f.weight)+' kg']].map(([l,v])=>`<div class="row"><span>${l}</span><strong>${v}</strong></div>`).join('')}<div class="row total"><span>当前重量规划参考</span><strong>${f.weightRemaining==null||f.expired?'待确认':fmt(f.weightRemaining)+' kg'}</strong></div></div><div class="card"><h3>可解释的计算口径</h3>${[['航段重量预算',o.budget==null?'未提供':fmt(o.budget)+' kg'],['减：预计托运行李',fmt(f.weight)+' kg'],['减：已分配其他货物',fmt(o.otherWeight)+' kg'],['减：运行缓冲',fmt(o.buffer)+' kg']].map(([l,v])=>`<div class="row"><span>${l}</span><strong>${v}</strong></div>`).join('')}<div class="note">演示基线：其他 79 名已申报旅客共 1140 kg；未申报旅客按每人 30 kg 补估。Lin 的最新申报只计一次，服务订单不另加一份货物。重量与空间须同时满足，最终配载由航司确认。</div><p class="small muted" style="margin-top:13px">已知件数 ${f.pieces} 件 · 估计体积 ${f.volume==null?'缺失':fmt(f.volume,2)+' m³'}<br>申报更新时间：${hk(state.lastSavedAt||state.declarations.lin?.updatedAt||state.clock)} HKT</p></div></div><div class="card" style="margin-top:22px"><div class="subhead"><div><h3>本次预报与行李归属</h3><p>每位乘机人、每个航段只使用最新有效版本。</p></div><button class="btn slim light" data-go="book">修改预报</button></div><div class="tablewrap"><table><thead><tr><th>乘机人</th><th>版本</th><th>已知件数</th><th>预计重量</th><th>来源 / 状态</th></tr></thead><tbody>${PEOPLE.map(t=>{const d=state.declarations[t.id],q=demand(d);return `<tr><td>${t.name}</td><td>${d?'v'+d.version:'未申报'}</td><td>${q.count??'未知'}</td><td>${fmt(q.weight)} kg</td><td>${q.imputed?'含系统补估':'旅客预估'}${q.review?' · 规则待复核':''}</td></tr>`}).join('')}</tbody></table></div></div><details class="controlbar"><summary>运营演示参数 · 缺失值不会被当作零</summary><div class="controlgrid">${field('重量预算 kg','ops.budget',o.budget??'','number','min="0"')}${field('空间预算 m³','ops.spaceBudget',o.spaceBudget??'','number','min="0" step="any"')}${field('其他货物 kg','ops.otherWeight',o.otherWeight,'number','min="0"')}${field('预留缓冲 kg','ops.buffer',o.buffer,'number','min="0"')}</div><label class="check"><input type="checkbox" data-field="ops.expired" ${o.expired?'checked':''}><span>模拟运营数据已过期</span></label></details>`;}
function controlsHTML(){return `<details class="controlbar"><summary>演示控制 · 固定场景，可重复录制 120 秒演示</summary><div class="controlgrid">${field('演示当前时间 · 香港时间','clock',localHK(state.clock),'datetime-local')}${field('CX257 起飞时间 · 香港时间','flight.departure',localHK(state.flight.departure),'datetime-local')}<label class="field"><span>规则资料状态</span><select class="input" data-field="agent.quality">${[['current','正常模拟资料'],['missing','无适用资料'],['expired','资料已过期'],['conflict','来源冲突']].map(([v,l])=>option(v,l,state.agent.quality)).join('')}</select></label>${field('演示账户可用里数','milesBalance',state.milesBalance,'number','min="0" step="1"')}</div><label class="check"><input type="checkbox" data-field="forceFail" ${state.forceFail?'checked':''}><span>模拟下一次支付失败（不会真实扣款）</span></label><div class="actions">${[['student','重置留学生场景'],['family','儿童家庭场景'],['late','超过申请截止'],['unknown','未知重量与尺寸']].map(([v,l])=>`<button class="btn slim light" data-action="scenario" data-scenario="${v}">${l}</button>`).join('')}</div><div class="note">使用固定本地模拟时钟，不等同于服务器时钟。状态保存在本浏览器，不接触真实账户。${storageOK?'':'当前浏览器禁用了本地存储，刷新后将无法恢复。'}</div></details>`;}
function render(){renderHeader();document.getElementById('main').innerHTML=({home:homeHTML,book:bookHTML,agent:agentHTML,journey:journeyHTML,ops:opsHTML}[state.view]||homeHTML)();document.getElementById('controls').innerHTML=controlsHTML();const log=document.getElementById('chatMessages');if(log)log.scrollTop=log.scrollHeight;}
function renderLive(){const el=document.getElementById('liveSummary');if(el)el.innerHTML=summaryHTML();}
function setField(el){const key=el.dataset.field;let v=el.type==='checkbox'?el.checked:el.value;if(key==='travellerId'){state.travellerId=v;state.profile=person().type;state.agent.itemId=draft().items[0]?.id||'';state.agent.pending=null;invalidateAgent();state.agreed=false;}else if(key==='zero'||key==='countUnknown'){draft()[key]=v;if(v)draft()[key==='zero'?'countUnknown':'zero']=false;state.agreed=false;invalidateAgent();}else if(key.startsWith('ops.')){state.ops[key.split('.')[1]]=key==='ops.expired'?v:v===''?null:Math.max(0,Number(v));}else if(key.startsWith('agent.')){state.agent[key.split('.')[1]]=v;state.agent.pending=null;invalidateAgent();}else if(key==='clock'||key==='flight.departure'){const date=new Date(v+':00+08:00');if(!Number.isFinite(date.getTime()))return;if(key==='clock')state.clock=date.toISOString();else{state.flight.departure=date.toISOString();state.flight.legId='CX257-'+v.slice(0,10);Object.values(state.declarations).forEach(d=>d.legId=state.flight.legId);state.agreed=false;invalidateAgent();}}else if(key==='milesBalance'){if(state.processing)return;state.milesBalance=Math.max(0,Math.floor(Number(v)||0));}else{state[key]=v;if(!['agreed','payment','forceFail'].includes(key))state.agreed=false;}persist();renderLive();}
function setItemField(el){const i=draft().items.find(i=>i.id===el.dataset.id);if(!i)return;const key=el.dataset.itemField;if(key==='service')i.service=el.checked;else if(['weight','l','w','h'].includes(key))i[key]=el.value===''?null:Number(el.value);else i[key]=el.value;if(key==='mode'&&i.mode==='cabin')i.service=false;state.agreed=false;invalidateAgent();persist();renderLive();}
function sendQuestion(question){const a=state.agent,text=String(question).trim();if(!text)return;a.messages.push({role:'user',text});a.messages=a.messages.slice(-18);a.stale=false;
if(!a.route){a.pending={type:'route'};a.answer=null;a.messages.push({role:'assistant',text:'先告诉我目的地国家或地区好吗？请选择咨询目的地，再重新发送问题。'});persist();render();return;}
let category=/电池|充电|battery|powerbank|Wh/i.test(text)?'battery':/衣|书|clothes|book/i.test(text)?'ordinary':/轮椅|辅助|设备|药/i.test(text)?'equipment':'unknown',energy=text.match(/(\d+(?:\.\d+)?)\s*wh/i);if(a.pending?.type==='battery')category='battery';
if(category==='battery'&&!energy&&!/不知道|未知|不清楚/.test(text)){a.pending={type:'battery'};a.answer=null;a.messages.push({role:'assistant',text:'请查看物品标签：额定能量是多少 Wh？是独立电池、充电宝，还是装在设备内？可回复“充电宝，74 Wh”。不知道规格时也请说明，我会保留待确认。'});persist();render();return;}
const reason=a.route!=='GB'?'当前模拟资料未覆盖这个目的地':a.quality==='expired'?'样本资料已过期':a.quality==='conflict'?'模拟来源存在冲突':a.quality==='missing'?'没有找到适用资料':category==='unknown'?'物品不在样本覆盖范围内':null;
if(reason){a.answer={title:'需要进一步核实',scope:a.route==='GB'?'英国 · LHR T3':'其他目的地',attributes:text,conclusions:['待确认','待确认','待确认'],note:reason+'，不会把无结果当作允许。请使用官方核实入口。',sourceIds:[],advice:null,retrievedAt:iso(state.clock)};}
else{const item=draft().items.find(i=>i.id===a.itemId),special=category!=='ordinary';a.answer={title:category==='battery'?'电池类物品 · 模拟检查结果':category==='equipment'?'辅助设备 · 需要专项确认':'衣物与书籍 · 模拟检查结果',scope:'CX257 · HKG → LHR T3 · 仅模拟规则',attributes:energy?'你提供的规格：'+energy[1]+' Wh（不作为真实放行阈值）':text,conclusions:special?['待核对英国入境要求','须核对规格与承运条件','待航司确认，尚非批准']:['样本可继续，实际需官方复核','样本可继续，须满足承运条件','样本可继续，须满足承运条件'],note:'以上为团队模拟资料，不是官方规则或运输许可。入境、机场安检与航司承运要求须分别核对。',sourceIds:['ENTRY','CARRIER','SECURITY'],advice:item?{itemId:item.id,type:category==='battery'&&item.category==='battery'?'cabin':'review',name:item.name}:null,retrievedAt:iso(state.clock)};}
a.pending=null;a.messages.push({role:'assistant',text:a.answer.title+'。已分别整理入境、随身和托运要求，请查看结果与资料来源。'});persist();render();}
function reviewAdvice(){const a=state.agent.answer;if(!a?.advice||state.agent.stale)return;const item=draft().items.find(i=>i.id===a.advice.itemId);if(!item)return;modal('确认后才更新清单',a.advice.type==='cabin'?`演示建议：将「${item.name}」改为随身物品，并从首末程托运服务移除。实际承运仍须官方确认。保存后重新计算需求及报价。`:`将「${item.name}」标记为规则待复核，保存后运营看板会显示复核件数。不会据此认定可以运输。`,[{text:'确认更新清单',action:'apply-advice'},{text:'暂不修改',action:'close-dialog',light:true}]);}
function applyAdvice(){const a=state.agent.answer;if(!a?.advice||state.agent.stale)return;const item=draft().items.find(i=>i.id===a.advice.itemId);if(!item)return;if(activeOrder()){toast('已有服务订单，请联系服务方或取消后再变更承运行李。');return;}item.review=true;if(a.advice.type==='cabin'){item.mode='cabin';item.service=false;}state.agreed=false;if(!saveDeclaration(true))return;a.advice=null;document.getElementById('dialog').close();persist();render();toast('已确认回写，预报与运营复核标记同步更新。');}
async function pay(){if(state.processing||activeOrder())return;const error=validateService(),q=quoteService();if(error||!q.valid){toast(error||q.error);return;}if(!state.agreed){toast('请先确认申报与模拟交易说明。');return;}if(state.payment==='miles'&&state.milesBalance<q.miles){toast('里数余额不足，请选择现金或调整服务。');return;}if(!saveDeclaration(true))return;
const snapshot={travellerId:state.travellerId,declaration:clone(draft()),flight:clone(state.flight),quote:clone(q),payment:state.payment,contact:state.contact,phone:state.phone,pickup:state.pickup,pickupAddress:state.pickupAddress,destination:state.destinationAddress,recipient:state.recipient,partner:state.partner,region:state.region,itemIds:checked(draft()).filter(i=>i.service).map(i=>i.id)};state.processing=true;state.pendingPayment=snapshot;state.frozenMiles=state.payment==='miles'?q.miles:0;persist();render();await new Promise(r=>setTimeout(r,500));if(!state.processing||state.pendingPayment!==snapshot)return;
const changed=quoteService().signature!==q.signature||state.travellerId!==snapshot.travellerId||state.payment!==snapshot.payment,insufficient=snapshot.payment==='miles'&&state.milesBalance<q.miles;
if(state.forceFail||changed||insufficient||!checkApplicationDeadline().valid){state.processing=false;state.pendingPayment=null;state.frozenMiles=0;state.forceFail=false;persist();render();toast(changed?'资料已改变，请重新确认；冻结已释放。':insufficient?'里数不足，冻结已释放。':'模拟支付未成功，草稿保留，冻结已释放。');return;}
if(snapshot.payment==='miles')state.milesBalance-=q.miles;state.orders.push({...snapshot,id:'PL-20261115-'+String(state.nextOrder++).padStart(3,'0'),status:'paid_demo',earned:false,refunded:false,createdAt:iso(state.clock)});state.processing=false;state.pendingPayment=null;state.frozenMiles=0;state.agreed=false;state.view='journey';persist();render();toast('演示订单已创建，实物交接仍等待确认。');}
function recordHandover(kind){const o=activeOrder();if(!o){toast('先创建服务预约，再演示交接。');return;}let type=kind,ids=o.itemIds;const c=eventCounts(o),n=ids.length;if(kind==='partial'){type='loaded';ids=ids.slice(0,Math.max(0,n-1));}if(type==='loaded'&&c.airport<n){toast('请先确认全部行李到达机场。');return;}if(type==='handover'&&c.loaded<n){toast('请先收到全部装机确认。');return;}if(!ids.length){toast('没有足够行李用于部分装机演示。');return;}const eventId=o.id+':'+type+':'+ids.join(',');if(state.events.some(e=>e.eventId===eventId)){toast('已确认，不重复增加件数。');return;}state.events.push({eventId,orderId:o.id,type,itemIds:clone(ids),legId:o.flight.legId,airport:type==='handover'?'LHR T3':'HKG',direction:type==='handover'?'国泰 → '+o.partner:'本地物流 → 国泰',confirmedAt:iso(state.clock)});persist();render();toast('模拟交接确认已更新。');}
function completeService(){const o=activeOrder();if(!o)return;if(o.status==='completed'){toast('已经完成，不重复入账。');return;}if(eventCounts(o).handover<o.itemIds.length){toast('请先确认当地物流接收全部行李。');return;}o.status='completed';if(o.payment==='cash'&&!o.earned){state.milesBalance+=o.quote.earn;o.earned=true;}persist();render();toast('模拟服务完成，合资格里数已入账。');}
function cancelOrder(id,confirmed=false){const o=state.orders.find(o=>o.id===id);if(!o||o.refunded)return;if(!confirmed){modal('取消演示订单',`订单 ${o.id} 将按原支付方式模拟退款。行李预报保留，待赚里数取消，已赚里数冲销。`,[{text:'确认取消并退款',action:'confirm-cancel',id},{text:'保留订单',action:'close-dialog',light:true}]);return;}if(o.earned&&state.milesBalance<o.quote.earn){toast('已赚里数不足以冲销，请联系服务方复核；订单尚未取消。');return;}if(o.payment==='miles')state.milesBalance+=o.quote.miles;if(o.earned){state.milesBalance-=o.quote.earn;o.earned=false;}o.refunded=true;o.status='cancelled';o.cancelledAt=iso(state.clock);persist();document.getElementById('dialog').close();render();toast('已取消并模拟退款，不重复退回权益。');}
function resetDemo(scenario){if(state.processing){toast('请等待模拟交易完成。');return;}state=initial();if(scenario==='family'){state.travellerId='child';state.profile='无人陪伴儿童';state.family=true;state.contact='家长 · 演示联系人';state.view='book';state.step=1;}if(scenario==='late'){state.clock='2026-11-14T09:30:01+08:00';state.view='book';state.step=4;}if(scenario==='unknown'){state.drafts.lin.items[0].weight=null;state.drafts.lin.items[0].l=null;saveDeclaration(true);state.view='ops';}persist();render();toast('演示场景已重置。');}
document.addEventListener('input',e=>{if(e.target.dataset.field&&!['checkbox','radio'].includes(e.target.type)&&e.target.tagName!=='SELECT')setField(e.target);if(e.target.dataset.itemField&&!['checkbox','radio'].includes(e.target.type)&&e.target.tagName!=='SELECT')setItemField(e.target);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.field){setField(el);if(el.tagName==='SELECT'||['checkbox','radio'].includes(el.type)||el.dataset.field.startsWith('ops.')||['clock','flight.departure','milesBalance'].includes(el.dataset.field))render();}if(el.dataset.itemField){setItemField(el);if(el.tagName==='SELECT'||el.type==='checkbox')render();}});
document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();sendQuestion(new FormData(e.target).get('question')||'');}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){go(b.dataset.go);return;}if(b.dataset.question){sendQuestion(b.dataset.question);return;}const id=b.dataset.id;switch(b.dataset.action){
case 'font':state.large=!state.large;persist();render();break;
case 'start':go('book',1);break;
case 'prev':state.step===1?go('home'):go('book',state.step-1);break;
case 'next':if(state.step===1&&(!state.contact.trim()||!state.phone.trim())){toast('请填写联系姓名与电话。');return;}if(state.step===2&&!saveDeclaration(true))return;if(state.step===4){const err=validateService();if(err){toast(err);return;}}go('book',Math.min(5,state.step+1));break;
case 'step':{const next=Number(b.dataset.step);if(next>state.step&&state.step===2&&!saveDeclaration(true))return;if(next===5){const err=validateService();if(err){toast(err);return;}if(!saveDeclaration(true))return;}go('book',next);break;}
case 'add-item':draft().zero=false;draft().countUnknown=false;draft().items.push({id:'bag-'+Date.now()+'-'+draft().items.length,name:'新增行李',category:'other',weight:null,l:null,w:null,h:null,mode:'checked',service:true,review:false});state.agreed=false;invalidateAgent();persist();render();break;
case 'remove-item':draft().items=draft().items.filter(i=>i.id!==id);if(state.agent.itemId===id)state.agent.itemId='';state.agreed=false;invalidateAgent();persist();render();break;
case 'save-declaration':if(saveDeclaration())render();break;
case 'ask-item':state.agent.itemId=id;state.agent.pending=null;invalidateAgent();go('book',3);break;
case 'source':{const s=RULES[id];if(s)modal(s.title,`发布机构：Plume Light 团队模拟资料\n适用范围：${s.scope}\n版本：DEMO 1.0\n更新：2026-10-19\n检索时间：${hk(state.agent.answer?.retrievedAt||state.clock)} HKT\n资料类型：模拟规则，无官方效力\n\n${s.body}`);break;}
case 'review-advice':reviewAdvice();break;
case 'apply-advice':applyAdvice();break;
case 'close-dialog':document.getElementById('dialog').close();break;
case 'pay':pay();break;
case 'event':recordHandover(b.dataset.kind);break;
case 'complete-service':completeService();break;
case 'cancel-order':cancelOrder(id);break;
case 'confirm-cancel':cancelOrder(id,true);break;
case 'contact':modal('联系服务方','演示联系预览\n\nCX257 · HKG → LHR T3\n目的地：LSE Student Dormitory 6\n\n请向服务方核对行李变更、待复核物品或交接事项。\n此原型不会发送真实消息。');break;
case 'scenario':modal('重置演示场景','清除本浏览器中的演示订单、里数变更和进度，恢复固定样本。不会影响真实账户。',[{text:'确认重置',action:'confirm-reset',id:b.dataset.scenario},{text:'取消',action:'close-dialog',light:true}]);break;
case 'confirm-reset':document.getElementById('dialog').close();resetDemo(id);break;
}});
window.addEventListener('storage',e=>{if(e.key!==KEY||state.processing||!e.newValue)return;try{const s=JSON.parse(e.newValue);if(s.schema===1){state=s;render();}}catch(_){}});
window.PlumeLight={getState:()=>clone(state),demand,validateDeclaration,aggregateBaggage,forecastCapacity,quoteService,checkApplicationDeadline,validateService,saveDeclaration,recordHandover,completeService,resetDemo};
persist();render();
</script></body></html>
